<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artificial Language Editor</title>
    
<script type="module">
import init, * as bindings from './editor-82b2174afd14f2a2.js';
const wasm = await init({ module_or_path: './editor-82b2174afd14f2a2_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!-- 本文に日本語が入ったときに読み込む、JIS 第1水準までの日本語フォント(src/platform.rs) -->
    
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      canvas {
        outline: none;
      }
      /* ブログ(Astro)のトップへ戻るリンク。エディタ下の余白(app.rsのEDITOR_BOTTOM_PADDING)に重ねる */
      #back {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 1;
        padding: 4px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        background: #fff;
        color: #3b5bdb;
        font: 13px/1.5 system-ui, sans-serif;
        text-decoration: none;
      }
      /* キー入力と IME を受け取る、見えないテキストエリア(src/platform.rs)。エディタのカーソル位置に
         置き、IME で変換している間だけ表示して変換中の文字列を見せる。クリックはキャンバスに通す */
      #ime-bridge {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1;
        width: 1px;
        height: 20px;
        margin: 0;
        padding: 0;
        border: 0;
        outline: none;
        resize: none;
        overflow: hidden;
        white-space: pre;
        background: transparent;
        color: transparent;
        caret-color: transparent;
        opacity: 0;
        pointer-events: none;
        font-family: "DejaVu Sans Mono", ui-monospace, monospace;
        line-height: 1.3;
      }
      #ime-bridge[data-composing] {
        width: auto;
        min-width: 4em;
        field-sizing: content;
        background: #fff;
        color: #222;
        opacity: 1;
        text-decoration: underline;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      /* スマホ・タブレット向けの案内。iced の canvas ではソフトウェアキーボードでうまく入力できないことがある */
      #mobile-note {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: #fff8db;
        border-bottom: 1px solid #f0d77a;
        color: #5c4a00;
        font: 13px/1.5 system-ui, sans-serif;
      }
      @media (max-width: 760px), (pointer: coarse) {
        #mobile-note {
          display: flex;
        }
      }
      #mobile-note[hidden] {
        display: none;
      }
      #mobile-note button {
        flex: none;
        padding: 2px 10px;
        border: 1px solid #d9c06a;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        color: #666;
      }
      /* icedがcanvasをbodyに追加したらローディング表示を消す */
      body:has(canvas) #loading {
        display: none;
      }
    </style>
  <link rel="modulepreload" href="./editor-82b2174afd14f2a2.js" crossorigin="anonymous" integrity="sha384-tiFrBF8ru37lhc9sT8ApOpo8aPZasVWQzXJtYULvA81hUKv5xe32d48TZm8iXzp+"><link rel="preload" href="./editor-82b2174afd14f2a2_bg.wasm" crossorigin="anonymous" integrity="sha384-q8d9AA9vroMbzftgk3kPQuKG0STLGYq5EMfOhcmty/a3KcB3avYOod74/kfELcGf" as="fetch" type="application/wasm"></head>
  <body>
    <a id="back" href="../">← 記事一覧</a>
    <textarea
      id="ime-bridge"
      aria-label="エディタの入力"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    ></textarea>
    <div id="mobile-note" role="note">
      <span>このエディタはパソコンのブラウザ向けです。スマートフォンやタブレットでは入力できないことがあります。</span>
      <button type="button" onclick="this.parentElement.hidden = true">閉じる</button>
    </div>
    <div id="loading">Loading…</div>
  </body>
</html>
